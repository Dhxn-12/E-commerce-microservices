<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ShopZone — Products</title>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
</head>
<body>
<div id="navbar"></div>
<div class="container" style="padding-top:24px">
  <div class="breadcrumb">
    <span onclick="location.href='../home.html'">Home</span>
    <span class="sep">›</span>
    <span id="breadcrumbCat">All Products</span>
  </div>
  <div class="products-wrap">
    <div class="filters-panel">
      <div class="filter-card">
        <div class="filter-title">Filters <span onclick="clearFilters()" style="color:var(--primary);cursor:pointer;font-weight:400;font-size:12px">Clear All</span></div>
        <div class="filter-title" style="border:none;margin-bottom:8px;padding-bottom:0">Category</div>
        <label class="filter-option"><input type="checkbox" value="Electronics" onchange="applyFilters()"/> Electronics</label>
        <label class="filter-option"><input type="checkbox" value="Fashion" onchange="applyFilters()"/> Fashion</label>
        <label class="filter-option"><input type="checkbox" value="Home" onchange="applyFilters()"/> Home</label>
        <label class="filter-option"><input type="checkbox" value="Books" onchange="applyFilters()"/> Books</label>
        <label class="filter-option"><input type="checkbox" value="Sports" onchange="applyFilters()"/> Sports</label>
        <label class="filter-option"><input type="checkbox" value="Beauty" onchange="applyFilters()"/> Beauty</label>
      </div>
      <div class="filter-card">
        <div class="filter-title">Price Range</div>
        <input type="range" class="price-range" id="priceRange" min="0" max="200000" value="200000" oninput="updatePrice(this.value)"/>
        <div class="price-vals"><span>₹0</span><span id="priceVal">₹2,00,000</span></div>
      </div>
      <div class="filter-card">
        <div class="filter-title">Rating</div>
        <label class="filter-option"><input type="radio" name="rating" value="4" onchange="applyFilters()"/> 4★ & above</label>
        <label class="filter-option"><input type="radio" name="rating" value="3" onchange="applyFilters()"/> 3★ & above</label>
        <label class="filter-option"><input type="radio" name="rating" value="0" onchange="applyFilters()" checked/> All</label>
      </div>
    </div>
    <div class="products-main">
      <div class="products-toolbar">
        <span class="results-count" id="resultsCount">Loading...</span>
        <div class="toolbar-right">
          <select class="sort-select" id="sortSelect" onchange="applyFilters()">
            <option value="default">Sort by: Relevance</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
          </select>
          <div class="view-btns">
            <button class="view-btn active" id="gridBtn" onclick="setView('grid')">⊞</button>
            <button class="view-btn" id="listBtn" onclick="setView('list')">☰</button>
          </div>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>
<div id="footer"></div>
<script src="../js/app.js"></script>
<script>
if(!APP.guard()) void 0;
document.getElementById('navbar').innerHTML = APP.renderNavbar('products');
document.getElementById('footer').innerHTML = APP.renderFooter();

let allProducts=[], filtered=[], currentPage=1, perPage=12;
const params = new URLSearchParams(location.search);
const initSearch = params.get('search')||'';
const initCat = params.get('category')||'';

if(initSearch) document.getElementById('searchInput').value = initSearch;
if(initCat){
  document.getElementById('breadcrumbCat').textContent = initCat;
  const cb = document.querySelector(`input[value="${initCat}"]`);
  if(cb) cb.checked = true;
}

function updatePrice(v){
  document.getElementById('priceVal').textContent='₹'+Number(v).toLocaleString('en-IN');
  applyFilters();
}

function clearFilters(){
  document.querySelectorAll('.filters-panel input[type=checkbox]').forEach(c=>c.checked=false);
  document.querySelector('input[name=rating][value="0"]').checked=true;
  document.getElementById('priceRange').value=200000;
  document.getElementById('priceVal').textContent='₹2,00,000';
  document.getElementById('sortSelect').value='default';
  applyFilters();
}

function applyFilters(){
  const cats=[...document.querySelectorAll('.filters-panel input[type=checkbox]:checked')].map(c=>c.value);
  const maxPrice=Number(document.getElementById('priceRange').value);
  const minRating=Number(document.querySelector('input[name=rating]:checked')?.value||0);
  const sort=document.getElementById('sortSelect').value;
  const search=document.getElementById('searchInput')?.value?.toLowerCase()||initSearch.toLowerCase();

  filtered=allProducts.filter(p=>{
    if(cats.length && !cats.includes(p.category)) return false;
    if(p.price>maxPrice) return false;
    if(search && !p.name.toLowerCase().includes(search) && !p.category.toLowerCase().includes(search)) return false;
    return true;
  });

  if(sort==='price-low') filtered.sort((a,b)=>a.price-b.price);
  else if(sort==='price-high') filtered.sort((a,b)=>b.price-a.price);
  else if(sort==='name') filtered.sort((a,b)=>a.name.localeCompare(b.name));

  currentPage=1;
  renderProducts();
}

function setView(v){
  const grid=document.getElementById('productGrid');
  grid.classList.toggle('list-view',v==='list');
  document.getElementById('gridBtn').classList.toggle('active',v==='grid');
  document.getElementById('listBtn').classList.toggle('active',v==='list');
}

function renderProducts(){
  const start=(currentPage-1)*perPage, end=start+perPage;
  const page=filtered.slice(start,end);
  document.getElementById('resultsCount').textContent=`${filtered.length} products found`;
  const grid=document.getElementById('productGrid');
  if(!page.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>No products found</h3><p>Try different filters</p></div>';return;}
  grid.innerHTML=page.map(p=>{
    const disc=Math.floor(Math.random()*40+5);
    const orig=Math.round(p.price*(1+disc/100));
    const inW=APP.wishlist().includes(p.id);
    return `<div class="product-card" onclick="location.href='product-detail.html?id=${p.id}'">
      ${disc>20?`<div class="badge">${disc}% OFF</div>`:''}
      <button class="wishlist-btn ${inW?'active':''}" onclick="event.stopPropagation();toggleW(${p.id},'${p.name.replace(/'/g,"\\'")}',this)">${inW?'❤️':'🤍'}</button>
      <div class="product-img">${APP.getCategoryEmoji(p.category)}</div>
      <div class="product-info">
        <div class="product-brand">${p.brand||p.category}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-rating"><span class="rating-badge">⭐ ${(4+Math.random()).toFixed(1)}</span><span class="rating-count">(${Math.floor(Math.random()*5000+100)})</span></div>
        <div class="product-price"><span class="price-current">${APP.formatPrice(p.price)}</span><span class="price-original">${APP.formatPrice(orig)}</span><span class="price-discount">${disc}% off</span></div>
      </div>
      <div class="product-actions">
        <button class="btn btn-orange btn-sm" onclick="event.stopPropagation();APP.addToCart(${p.id},'${p.name.replace(/'/g,"\\'")}',${p.price})">🛒 Add</button>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();APP.addToCart(${p.id},'${p.name.replace(/'/g,"\\'")}',${p.price});location.href='cart.html'">Buy Now</button>
      </div>
    </div>`;
  }).join('');
  renderPagination();
}

function renderPagination(){
  const pages=Math.ceil(filtered.length/perPage);
  if(pages<=1){document.getElementById('pagination').innerHTML='';return;}
  let html='';
  if(currentPage>1) html+=`<button class="page-btn" onclick="goPage(${currentPage-1})">‹</button>`;
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-currentPage)<=1) html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-currentPage)===2) html+=`<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
  }
  if(currentPage<pages) html+=`<button class="page-btn" onclick="goPage(${currentPage+1})">›</button>`;
  document.getElementById('pagination').innerHTML=html;
}

function goPage(p){currentPage=p;renderProducts();window.scrollTo(0,0);}
function toggleW(id,name,btn){const a=APP.toggleWishlist(id,name);btn.textContent=a?'❤️':'🤍';btn.classList.toggle('active',a);}

async function init(){
  const grid=document.getElementById('productGrid');
  grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Loading products...</div>`;
  try{
    allProducts=await APP.get('/api/products')||[];
    filtered=[...allProducts];
    if(initCat){const cb=document.querySelector(`input[value="${initCat}"]`);if(cb)cb.checked=true;}
    applyFilters();
  }catch(e){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--danger)">Failed to load products</div>';}
}
init();
</script>
</body>
</html>
